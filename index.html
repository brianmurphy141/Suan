<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/cormorant-garamond-300.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-400.woff2) format("woff2")}
[hidden]{display:none!important}
:root{
  /* Layout: full screen colour field with one glass lens. Sleep timer top right, time in the app bottom right. Tap for night mode. */
  --night:#03050b;
  --moon:#e8ecfd;
  --mist:rgba(220,228,255,.6);
  --hair:rgba(255,255,255,.12);
  --glass:rgba(12,15,28,.72);
  --h:260;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night);padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;padding-inline:16px;
  display:flex;flex-direction:column;
  background:var(--night);color:var(--moon);
  font-family:var(--f-mono);font-size:14px;
  overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
body.sheet-open{touch-action:auto}
button{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}

.pad{position:relative;z-index:1;flex:1 1 auto;min-height:0;width:100%;margin-block:16px;touch-action:none}

/* the lens: a glass layer over a ring, so night mode can drop the glass and keep only the outline */
.lens{
  position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  border:1px solid hsl(var(--h) 90% 88% / .5);
  pointer-events:none;will-change:transform;transition:border-color 1.2s;
}
.glass{
  position:absolute;inset:-1px;border-radius:50%;
  background:
    radial-gradient(circle at 33% 28%, rgba(255,255,255,.5), rgba(255,255,255,.07) 28%, rgba(255,255,255,0) 55%),
    radial-gradient(circle, hsl(var(--h) 90% 75% / .05) 40%, hsl(var(--h) 90% 75% / .26) 100%);
  -webkit-backdrop-filter:saturate(1.9) brightness(1.5);
  backdrop-filter:saturate(1.9) brightness(1.5);
  box-shadow:0 0 50px 8px hsl(var(--h) 90% 70% / .42), inset 0 0 18px hsl(var(--h) 90% 88% / .3);
  transition:opacity 1.2s;
}
.night .lens{border-color:rgba(255,255,255,.85)}
.night .glass{opacity:0}

.readout{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .5s}
.readout.show{opacity:1}
.night .readout{visibility:hidden}
.readout .big{font-family:var(--f-display);font-weight:300;font-size:34px;line-height:1;font-variant-numeric:lining-nums}
.readout .u{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;margin-left:6px;color:var(--mist)}
.readout .sub{margin-top:6px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}

/* corner pieces, hidden in night mode */
.chrome{position:fixed;z-index:5;transition:opacity .8s,visibility 0s}
.night .chrome{opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s}

.tbtn{
  top:calc(env(safe-area-inset-top, 0px) + 8px);right:6px;
  height:44px;min-width:44px;padding:0 12px;
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  background:none;border:0;border-radius:999px;cursor:pointer;
}
.tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round;opacity:.75;transition:opacity .4s}
.tbtn.on svg{opacity:1}
.tbtn .tl{font-size:10.5px;letter-spacing:.12em;color:var(--mist);font-variant-numeric:tabular-nums}
.tbtn:focus-visible{outline:1px solid var(--mist);outline-offset:-2px}

.elapsed{
  right:20px;bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  font-size:10.5px;letter-spacing:.12em;color:var(--mist);font-variant-numeric:tabular-nums;pointer-events:none;
}
.hint{
  left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 48px);transform:translateX(-50%);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);white-space:nowrap;pointer-events:none;
}
.hint.gone{opacity:0}
.awake{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}

/* sleep timer window */
.scrim{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(3,5,11,.45)}
.sheet{
  width:min(300px,100%);padding:20px 18px 16px;
  display:flex;flex-direction:column;gap:14px;
  border-radius:24px;background:var(--glass);border:1px solid var(--hair);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  animation:rise .28s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.sheet-title{text-align:center;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
.wheels{position:relative;display:grid;grid-template-columns:1fr 1fr;height:200px}
.band{position:absolute;left:4px;right:4px;top:80px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);pointer-events:none}
.wcol{position:relative;min-width:0}
.wheel{
  position:relative;z-index:1;height:200px;overflow-y:auto;
  scroll-snap-type:y mandatory;overscroll-behavior:contain;touch-action:pan-y;
  scrollbar-width:none;outline:none;border-radius:12px;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 32%,#000 68%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 32%,#000 68%,transparent);
}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{background:rgba(255,255,255,.04)}
.sp{height:80px}
.it{
  height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-family:var(--f-display);font-weight:300;font-size:26px;font-variant-numeric:lining-nums tabular-nums;
  color:var(--mist);cursor:pointer;transition:color .2s;
}
.it.sel{color:var(--moon)}
.wl{position:absolute;z-index:2;top:50%;left:calc(50% + 22px);transform:translateY(-50%);font-size:10px;letter-spacing:.16em;color:var(--mist);pointer-events:none}
.acts{display:flex;gap:10px}
.acts button{flex:1;height:44px;border-radius:999px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--hair);color:var(--mist)}
.go{background:hsl(var(--h) 70% 65% / .24);border:1px solid hsl(var(--h) 80% 80% / .42);color:var(--moon)}
.acts button:focus-visible{outline:1px solid var(--mist);outline-offset:2px}

@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif;color:#e8ecfd">Suan needs JavaScript to play sound.</p></noscript>

<canvas id="bg" aria-hidden="true"></canvas>

<main class="pad" id="pad" aria-label="Sleep tone. Drag to tune, tap for night mode.">
  <div class="readout" id="ro" aria-hidden="true">
    <div class="big"><span id="tone">220</span><span class="u">Hz</span></div>
    <div class="sub" id="pulse">6 Hz pulse · theta</div>
  </div>
  <div class="lens" id="lens" aria-hidden="true"><div class="glass"></div></div>
</main>

<button class="chrome tbtn" id="tbtn" type="button" aria-label="Sleep timer" aria-haspopup="dialog">
  <span class="tl" id="tl"></span>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.3A8.5 8.5 0 1 1 10.7 3.5 7 7 0 0 0 20.5 13.3z"/></svg>
</button>
<div class="chrome elapsed" id="elapsed" role="timer" aria-label="Time in app">0:00:00</div>
<div class="chrome hint gone" id="hint" aria-hidden="true"></div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <div class="sheet-title" id="st">Sleep timer</div>
    <div class="wheels">
      <div class="band"></div>
      <div class="wcol"><div class="wheel" id="wh" tabindex="0" aria-label="Hours"></div><span class="wl">h</span></div>
      <div class="wcol"><div class="wheel" id="wm" tabindex="0" aria-label="Minutes"></div><span class="wl">m</span></div>
    </div>
    <div class="acts">
      <button class="ghost" id="toff" type="button">Cancel</button>
      <button class="go" id="tgo" type="button">Start</button>
    </div>
  </div>
</div>

<script>
(() => {
  const P0 = 0.5, P1 = 40;        // pulse range, left to right
  const T0 = 20, T1 = 640;        // tone range, bottom to top
  const M = 34;                   // keeps the lens fully on screen
  const VOL = 0.55, BREATH = 0.08;
  const FADE = 60000;             // the sleep timer fades out over its last minute
  const ITEM = 40;                // picker row height
  const HOURS = Array.from({ length: 13 }, (_, i) => i);
  const MINS = Array.from({ length: 12 }, (_, i) => i * 5);
  const HINT_TOUCH = 'touch anywhere for sound';
  const AUTO_NIGHT = 180000;      // left untouched this long while playing, it slips into night mode

  const body = document.body, root = document.documentElement;
  const $ = id => document.getElementById(id);
  const bg = $('bg'), pad = $('pad'), lens = $('lens'), ro = $('ro'), toneEl = $('tone'), pulseEl = $('pulse'),
        hint = $('hint'), tbtn = $('tbtn'), tl = $('tl'), elapsed = $('elapsed'),
        scrim = $('scrim'), wh = $('wh'), wm = $('wm'), toff = $('toff'), tgo = $('tgo');
  const g = bg.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const openedAt = Date.now();

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lg = (v, a, b) => (Math.log(v) - Math.log(a)) / (Math.log(b) - Math.log(a));
  const ex = (t, a, b) => Math.exp(Math.log(a) + t * (Math.log(b) - Math.log(a)));
  const qP = v => v < 4 ? Math.round(v * 10) / 10 : v < 10 ? Math.round(v * 2) / 2 : Math.round(v);
  const fmtP = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
  const band = v => v < 4 ? 'delta' : v < 8 ? 'theta' : v < 13 ? 'alpha' : v < 30 ? 'beta' : 'gamma';
  const depth = v => 0.55 + 0.25 * clamp((Math.log(10) - Math.log(v)) / (Math.log(10) - Math.log(2)), 0, 1);
  const loud = f => clamp(Math.pow(240 / f, 0.35), 0.6, 1.4);
  const pad2 = n => String(n).padStart(2, '0');
  const fmtClock = secs => {
    const s = Math.max(0, Math.floor(secs));
    return `${Math.floor(s / 3600)}:${pad2(Math.floor(s % 3600 / 60))}:${pad2(s % 60)}`;
  };

  /* State */
  let pulse = 6, tone = 220;
  try {
    const sp = parseFloat(localStorage.getItem('suan3-p')), st = parseFloat(localStorage.getItem('suan3-t'));
    if (sp >= P0 && sp <= P1) pulse = qP(sp);
    if (st >= T0 && st <= T1) tone = Math.round(st);
  } catch (e) {}
  let posX = lg(pulse, P0, P1), posY = lg(tone, T0, T1), dX = posX, dY = posY;
  let soundOn = false, ended = false, endAt = null, fading = false, introShown = false;
  let pt = null, sheetOpen = false, lastTouch = Date.now();
  const save = () => { try { localStorage.setItem('suan3-p', String(pulse)); localStorage.setItem('suan3-t', String(tone)); } catch (e) {} };

  /* Hints */
  let hintT = 0;
  function showHint(text, ms) {
    hint.textContent = text; hint.classList.remove('gone');
    clearTimeout(hintT);
    if (ms) hintT = setTimeout(() => hint.classList.add('gone'), ms);
  }
  const hideHint = () => { clearTimeout(hintT); hint.classList.add('gone'); };

  /* Audio: one sine tone, gently pulsed */
  let ac = null, master, osc, am, lfo, lfoD, lv, suspendT = 0, waitT = 0, tag = null;
  const running = () => !!ac && ac.state === 'running';
  const live = () => soundOn && running();

  function silentWav() {
    const n = 4000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return 'data:audio/wav;base64,' + btoa(s);
  }
  // A silent media element puts iPhones into playback mode, so the tone plays with the ring switch on silent
  function unlockOn() {
    try {
      if (!tag) { tag = new Audio(silentWav()); tag.loop = true; tag.setAttribute('playsinline', ''); }
      if (tag.paused) { const p = tag.play(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  }
  function unlockOff() { try { if (tag) tag.pause(); } catch (e) {} }

  function ensureAudio() {
    if (ac) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    lv = ac.createGain(); lv.gain.value = loud(tone); lv.connect(master);
    const d = depth(pulse);
    am = ac.createGain(); am.gain.value = 1 - d / 2; am.connect(lv);
    osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = tone; osc.connect(am);
    lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = pulse;
    lfoD = ac.createGain(); lfoD.gain.value = d / 2;
    lfo.connect(lfoD); lfoD.connect(am.gain);
    osc.start(); lfo.start();
    ac.onstatechange = onState;
  }
  function applyPulse() {
    if (!ac) return;
    const t = ac.currentTime, d = depth(pulse);
    lfo.frequency.setTargetAtTime(pulse, t, 0.05);
    am.gain.setTargetAtTime(1 - d / 2, t, 0.1);
    lfoD.gain.setTargetAtTime(d / 2, t, 0.1);
  }
  function applyTone() {
    if (!ac) return;
    const t = ac.currentTime;
    osc.frequency.setTargetAtTime(tone, t, 0.05);
    lv.gain.setTargetAtTime(loud(tone), t, 0.1);
  }
  function hold(p, t) {
    if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
    else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
  }
  function ramp(p, target, tau) { const t = ac.currentTime; hold(p, t); p.setTargetAtTime(target, t, tau); }
  function rampLin(p, target, secs) { const t = ac.currentTime; hold(p, t); p.linearRampToValueAtTime(target, t + Math.max(0.1, secs)); }
  const tryResume = () => { if (ac && ac.state !== 'running') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } };

  // when sound is on but the phone has not allowed it yet, ask for one touch
  function onState() {
    clearTimeout(waitT);
    if (running()) {
      if (!soundOn) return;
      if (!introShown) { introShown = true; showHint('drag to tune · tap for night', 6000); }
      else if (hint.textContent === HINT_TOUCH) hideHint();
    } else if (soundOn) {
      waitT = setTimeout(() => { if (soundOn && !running()) showHint(HINT_TOUCH, 0); }, 700);
    }
  }

  function startSound() {
    ensureAudio();
    unlockOn();
    clearTimeout(suspendT);
    tryResume();
    ramp(master.gain, VOL, 1.3);
    soundOn = true; ended = false; fading = false;
    stayAwake();
    onState();
  }
  // the sleep timer ran out: sound off, screen allowed to sleep
  function finish() {
    endAt = null; fading = false; soundOn = false; ended = true;
    if (ac) {
      ramp(master.gain, 0, 0.4);
      clearTimeout(suspendT);
      suspendT = setTimeout(() => { if (ended) { ac.suspend(); unlockOff(); } }, 3000);
    }
    allowSleep(); timerLabel();
  }
  // every touch makes sure the sound is actually running
  function kick() {
    if (!soundOn || !ac) return;
    unlockOn();
    tryResume();
    stayAwake();
  }

  /* Keep the iPhone from auto locking while the sound plays, because a locked iPhone stops web audio.
     Two layers: the screen wake lock where the browser allows it, and a tiny live video stream,
     which iPhones treat like a video call and keep the screen on for. */
  let lock = null, locking = false;
  async function lockOn() {
    if (lock || locking || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    locking = true;
    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } catch (e) { lock = null; }
    locking = false;
    if (lock && !soundOn) lockOff();
  }
  function lockOff() { try { if (lock) lock.release(); } catch (e) {} lock = null; }

  let awakeVid = null, awakeCtx = null, awakeT = 0;
  function paintAwake() {
    if (!awakeCtx) return;
    awakeCtx.fillStyle = Math.floor(Date.now() / 1000) % 2 ? '#010101' : '#020202';
    awakeCtx.fillRect(0, 0, 2, 2);
  }
  function awakeOn() {
    try {
      if (!awakeVid) {
        const c = document.createElement('canvas'); c.width = 2; c.height = 2;
        if (!c.captureStream) return;
        awakeCtx = c.getContext('2d'); paintAwake();
        const v = document.createElement('video');
        v.muted = true; v.defaultMuted = true;
        v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
        v.setAttribute('aria-hidden', 'true'); v.className = 'awake';
        v.srcObject = c.captureStream(1);
        document.body.appendChild(v);
        awakeVid = v;
      }
      if (!awakeT) awakeT = setInterval(paintAwake, 1000);
      if (awakeVid.paused) { const p = awakeVid.play(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  }
  function awakeOff() {
    clearInterval(awakeT); awakeT = 0;
    try { if (awakeVid) awakeVid.pause(); } catch (e) {}
  }
  const stayAwake = () => { lockOn(); awakeOn(); };
  const allowSleep = () => { lockOff(); awakeOff(); };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (soundOn) { stayAwake(); tryResume(); }
    tick();
  });

  const toggleNight = () => { body.classList.toggle('night'); ro.classList.remove('show'); };

  /* Readout shows only while tuning */
  let roT = 0, roW = 0, roH = 0;
  const hideReadout = () => ro.classList.remove('show');
  function showReadout() {
    toneEl.textContent = tone;
    pulseEl.textContent = `${fmtP(pulse)} Hz pulse · ${band(pulse)}`;
    roW = ro.offsetWidth; roH = ro.offsetHeight;
    ro.classList.add('show');
    clearTimeout(roT);
    if (!pt) roT = setTimeout(hideReadout, 1600);
  }
  function setPos(x, y) {
    posX = clamp(x, 0, 1); posY = clamp(y, 0, 1);
    const np = qP(ex(posX, P0, P1));
    let nt = Math.round(ex(posY, T0, T1));
    if (Math.abs(nt - 40) <= 1) nt = 40;   // a gentle catch at 40 Hz
    if (np !== pulse) { pulse = np; applyPulse(); }
    if (nt !== tone) { tone = nt; applyTone(); }
    save(); showReadout();
  }

  /* Geometry */
  let rect = { left: 0, top: 0, width: 1, height: 1 }, W = 0, H = 0, blackDone = false;
  function layout() {
    const r = pad.getBoundingClientRect();
    rect = { left: r.left, top: r.top, width: r.width, height: r.height };
    W = innerWidth; H = innerHeight;
    bg.width = Math.round(W); bg.height = Math.round(H);
    blackDone = false;
  }
  addEventListener('resize', layout);
  if ('ResizeObserver' in window) new ResizeObserver(layout).observe(pad);
  layout();
  const spanW = () => Math.max(1, rect.width - 2 * M), spanH = () => Math.max(1, rect.height - 2 * M);

  /* Sleep timer and time in app */
  function timerLabel() {
    if (endAt) {
      tl.textContent = fmtClock(Math.ceil((endAt - Date.now()) / 1000));
      if (!tbtn.classList.contains('on')) { tbtn.classList.add('on'); tbtn.setAttribute('aria-label', 'Sleep timer, on'); }
    } else {
      tl.textContent = '';
      tbtn.classList.remove('on');
      tbtn.setAttribute('aria-label', 'Sleep timer');
    }
  }
  function setTimer(mins) {
    if (mins <= 0) { clearTimer(); return; }
    endAt = Date.now() + mins * 60000;
    if (fading && ac) { ramp(master.gain, VOL, 1.5); fading = false; }
    if (ended || !soundOn) startSound();
    timerLabel();
  }
  function clearTimer() {
    endAt = null;
    if (fading && ac) { ramp(master.gain, VOL, 1.5); fading = false; }
    timerLabel();
  }
  function tick() {
    const txt = fmtClock((Date.now() - openedAt) / 1000);
    if (elapsed.textContent !== txt) elapsed.textContent = txt;
    if (live() && !sheetOpen && !body.classList.contains('night') && Date.now() - lastTouch > AUTO_NIGHT) toggleNight();
    if (endAt) {
      const rem = endAt - Date.now();
      if (rem <= 0) { finish(); return; }
      if (rem <= FADE && !fading && soundOn && ac) { fading = true; rampLin(master.gain, 0, rem / 1000); }
      timerLabel();
    }
  }
  setInterval(tick, 250);

  /* Hours and minutes picker */
  const items = el => el.querySelectorAll('.it');
  const idx = el => clamp(Math.round(el.scrollTop / ITEM), 0, items(el).length - 1);
  function mark(el) { const i = idx(el); items(el).forEach((d, j) => d.classList.toggle('sel', j === i)); }
  function build(el, labels) {
    const sp = () => { const d = document.createElement('div'); d.className = 'sp'; return d; };
    el.appendChild(sp());
    labels.forEach((txt, i) => {
      const d = document.createElement('div');
      d.className = 'it'; d.textContent = txt;
      d.addEventListener('click', () => el.scrollTo({ top: i * ITEM, behavior: reduce.matches ? 'auto' : 'smooth' }));
      el.appendChild(d);
    });
    el.appendChild(sp());
    let raf = 0;
    el.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; mark(el); }); }, { passive: true });
    el.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      const i = clamp(idx(el) + (e.key === 'ArrowDown' ? 1 : -1), 0, labels.length - 1);
      el.scrollTo({ top: i * ITEM, behavior: reduce.matches ? 'auto' : 'smooth' });
    });
  }
  build(wh, HOURS.map(String));
  build(wm, MINS.map(pad2));

  function openSheet() {
    let mins = 60;
    if (endAt) mins = Math.ceil((endAt - Date.now()) / 60000 / 5) * 5;
    else { try { const s = parseInt(localStorage.getItem('suan-timer'), 10); if (s > 0) mins = s; } catch (e) {} }
    const h = Math.min(12, Math.floor(mins / 60)), m = mins % 60;
    toff.textContent = endAt ? 'Turn off' : 'Cancel';
    scrim.hidden = false; sheetOpen = true; body.classList.add('sheet-open');
    const place = () => { wh.scrollTop = h * ITEM; wm.scrollTop = (m / 5) * ITEM; mark(wh); mark(wm); };
    place(); requestAnimationFrame(place);
    wh.focus({ preventScroll: true });
  }
  function closeSheet() { scrim.hidden = true; sheetOpen = false; body.classList.remove('sheet-open'); tbtn.focus({ preventScroll: true }); }

  tbtn.addEventListener('click', () => { kick(); openSheet(); });
  tgo.addEventListener('click', () => {
    const mins = HOURS[idx(wh)] * 60 + MINS[idx(wm)];
    try { localStorage.setItem('suan-timer', String(mins)); } catch (e) {}
    setTimer(mins);
    closeSheet();
  });
  toff.addEventListener('click', () => { if (endAt) clearTimer(); closeSheet(); });
  scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });

  /* Tap anywhere for night mode, drag anywhere to tune */
  const isUI = t => t && t.closest && t.closest('.tbtn, .scrim');
  addEventListener('pointerdown', e => {
    lastTouch = Date.now();
    const unlocking = soundOn && !running();   // a touch that only lets the sound start does not switch modes
    kick();
    if (sheetOpen || isUI(e.target) || pt) return;
    pt = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY,
           t: performance.now(), moved: false, unlocking };
  });
  addEventListener('pointermove', e => {
    if (!pt || e.pointerId !== pt.id) return;
    if (!pt.moved && Math.hypot(e.clientX - pt.sx, e.clientY - pt.sy) < 8) return;
    pt.moved = true;
    const dx = e.clientX - pt.lx, dy = e.clientY - pt.ly;
    pt.lx = e.clientX; pt.ly = e.clientY;
    setPos(posX + dx / spanW(), posY - dy / spanH());
  });
  addEventListener('pointerup', e => {
    lastTouch = Date.now();
    kick();
    if (!pt || e.pointerId !== pt.id) return;
    const p = pt; pt = null;
    if (!p.moved && performance.now() - p.t < 600) { if (!p.unlocking) toggleNight(); }
    else if (p.moved && ended) startSound();
    clearTimeout(roT); roT = setTimeout(hideReadout, 1600);
  });
  addEventListener('pointercancel', e => { if (pt && e.pointerId === pt.id) pt = null; });
  addEventListener('touchend', kick, { passive: true });
  addEventListener('click', kick);

  addEventListener('keydown', e => {
    lastTouch = Date.now();
    const unlocking = soundOn && !running();
    kick();
    if (sheetOpen) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
    if (e.target && e.target.closest && e.target.closest('button')) return;
    if (e.key.startsWith('Arrow') && ended) startSound();
    switch (e.key) {
      case ' ': case 'Enter': if (!unlocking && !e.repeat) toggleNight(); break;
      case 'ArrowRight': setPos(posX + 0.02, posY); break;
      case 'ArrowLeft':  setPos(posX - 0.02, posY); break;
      case 'ArrowUp':    setPos(posX, posY + 0.02); break;
      case 'ArrowDown':  setPos(posX, posY - 0.02); break;
      default: return;
    }
    e.preventDefault();
  });

  /* Colour field that follows the lens */
  function blob(x, y, r, h, l, a) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `hsla(${h},80%,${l}%,${a})`);
    rg.addColorStop(0.45, `hsla(${h},80%,${l}%,${a * 0.38})`);
    rg.addColorStop(1, `hsla(${h},80%,${l}%,0)`);
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }

  let lastWork = 0, dayK = 1, hShown = -1;
  function frame(now) {
    requestAnimationFrame(frame);
    // once night mode has gone black, only the breathing outline moves, so update a few times a second
    if (body.classList.contains('night') && dayK <= 0.003 && !pt && now - lastWork < 66) return;
    const dt = Math.min(0.08, (now - (lastWork || now)) / 1000); lastWork = now;
    const k = Math.min(1, dt * (pt ? 30 : 9));
    dX += (posX - dX) * k; dY += (posY - dY) * k;
    dayK += ((body.classList.contains('night') ? 0 : 1) - dayK) * Math.min(1, dt * 1.6);
    const on = live();
    const br = on && !reduce.matches ? 0.5 + 0.5 * Math.sin(2 * Math.PI * BREATH * now / 1000) : 0.5;

    const px = M + dX * spanW(), py = M + (1 - dY) * spanH();
    lens.style.transform = `translate(${px.toFixed(1)}px,${py.toFixed(1)}px) scale(${on ? (0.97 + 0.06 * br).toFixed(3) : 1})`;

    let rx = px + 42, ry = py - roH - 22;
    if (rx + roW > rect.width) rx = px - 42 - roW;
    if (ry < 0) ry = py + 42;
    ro.style.transform = `translate(${rx.toFixed(1)}px,${ry.toFixed(1)}px)`;

    const h1 = 170 + dX * 160;
    const h2 = h1 + 70 - dY * 130;
    const h3 = (h1 + h2) / 2 + 30;
    if (Math.abs(h1 - hShown) > 0.3) { root.style.setProperty('--h', h1.toFixed(1)); hShown = h1; }

    if (dayK > 0.003) {
      blackDone = false;
      const I = (on ? 0.82 + 0.18 * br : 0.62) * dayK;
      const cx = rect.left + px, cy = rect.top + py, m = Math.max(W, H);
      const drift = reduce.matches ? 0 : now;
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = '#03050b'; g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'lighter';
      blob(cx, cy, m * 0.95, h1, 40 + dY * 14, 0.55 * I);
      blob(W - cx, H - cy, m * 0.85, h2, 30 + dY * 12, 0.5 * I);
      blob(W * (0.5 + 0.35 * Math.sin(drift / 23000)), H * (0.5 + 0.35 * Math.cos(drift / 31000)), m * 0.6, h3, 32, 0.22 * I);
      g.globalCompositeOperation = 'source-over';
    } else if (!blackDone) {
      // night mode: paint black once, then stop drawing
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = '#000000'; g.fillRect(0, 0, W, H);
      blackDone = true;
    }
  }

  // start the sound as soon as the page opens; if the phone holds it back, the first touch releases it
  startSound();
  tick();
  timerLabel();
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
